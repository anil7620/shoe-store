<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .alert-enter { opacity: 0; }
        .alert-enter-active { opacity: 1; transition: opacity 0.3s; }
        .alert-exit { opacity: 1; }
        .alert-exit-active { opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Buyer Login</h1>

        <!-- Flash Message -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div id="flash-message" class="mb-4 p-4 rounded-lg 
                    {% if messages[0][0] == 'error' %}bg-red-500 text-white{% else %}bg-green-500 text-white{% endif %}">
                    <div class="flex justify-between items-center">
                        <span>{{ messages[0][1] }}</span>
                        <button id="close-flash" class="text-xl font-bold ml-4">&times;</button>
                    </div>
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('buyer_login') }}" method="POST">
            <div class="mb-4">
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 w-full">Login</button>
        </form>

        <div class="mt-4 text-center">
            <a href="{{ url_for('register_buyer') }}" class="text-gray-600 hover:underline">Don't have an account? Register</a>
        </div>
    </div>

    <!-- Flash Message Close Script -->
    <script>
        const flashMessage = document.getElementById('flash-message');
        const closeFlash = document.getElementById('close-flash');

        if (closeFlash) {
            closeFlash.addEventListener('click', () => {
                flashMessage.classList.add('alert-exit-active');
                setTimeout(() => flashMessage.remove(), 300);
            });
        }
    </script>
</body>
</html>
