<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-3xl">
        <h1 class="text-2xl font-bold mb-6 text-center">Register</h1>
        <form action="{{ url_for('register_buyer') }}" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- First Name -->
            <div>
                <label for="first_name" class="block text-gray-700 mb-1">Name</label>
                <input type="text" id="first_name" name="first_name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Date of Birth -->
            <div>
                <label for="date_of_birth" class="block text-gray-700 mb-1">Date of Birth</label>
                <input type="date" id="date_of_birth" name="date_of_birth" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- City -->
            <div>
                <label for="city" class="block text-gray-700 mb-1">City</label>
                <input type="text" id="city" name="city" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Zip Code -->
            <div>
                <label for="zip_code" class="block text-gray-700 mb-1">Zip Code</label>
                <input type="text" id="zip_code" name="zip_code" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Phone Number -->
            <div>
                <label for="phone_number" class="block text-gray-700 mb-1">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Address -->
            <div class="md:col-span-2">
                <label for="address" class="block text-gray-700 mb-1">Address</label>
                <textarea id="address" name="address" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" rows="3" required></textarea>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password" class="block text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Submit Button -->
            <div class="md:col-span-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 w-full font-semibold">
                    Register
                </button>
            </div>
        </form>
        
        <!-- Login Link -->
        <div class="mt-4 text-center">
            <a href="{{ url_for('buyer_login') }}" class="text-gray-600 hover:underline">Already have an account? Login</a>
        </div>
    </div>
</body>
</html>
