<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/kTc+9FfCLhVJj6MY26YJl5M1t4GnL7yoj7RC1Q5uPqkuFV69Wr8ldQcSRdgo8cM/Mh58HW8Yc3nbA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-gray-100 flex">
    <!-- Sidebar -->
    <aside class="bg-blue-600 text-white w-64 min-h-screen p-4">
     
        <nav>
            <ul class="space-y-4">
                <li>
                    <a href="{{ url_for('admin_dashboard') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-700 {{ 'bg-blue-700' if request.endpoint == 'admin_dashboard' else '' }}">
                        <i class="fas fa-shoe-prints mr-2"></i>Shoes
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('view_categories') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-700 {{ 'bg-blue-700' if request.endpoint == 'view_categories' else '' }}">
                        <i class="fas fa-tags mr-2"></i>Categories
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_view_orders') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-700 {{ 'bg-blue-700' if request.endpoint == 'admin_view_orders' else '' }}">
                        <i class="fas fa-shopping-cart mr-2"></i>View Orders
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-700">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-x-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Categories</h1>
            <a href="{{ url_for('add_category') }}" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center">
                <i class="fas fa-plus mr-2"></i>Add Category
            </a>
        </div>

        <!-- Categories Table -->
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white rounded-lg shadow-lg overflow-hidden">
                <thead class="bg-blue-600 text-white">
                    <tr>
                        <th class="px-6 py-3 text-left font-medium">Category Name</th>
                        <th class="px-6 py-3 text-left font-medium">Description</th>
                        <th class="px-6 py-3 text-left font-medium">Status</th>
                        <th class="px-6 py-3 text-left font-medium">Actions</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    {% for category in categories %}
                    <tr class="hover:bg-gray-100">
                        <td class="border px-6 py-4">{{ category.category_name }}</td>
                        <td class="border px-6 py-4">{{ category.description }}</td>
                        <td class="border px-6 py-4">{{ category.status }}</td>
                        <td class="border px-6 py-4 flex space-x-4">
                            <!-- Edit Button -->
                            <a href="{{ url_for('edit_category', category_id=category._id) }}" class="text-blue-600 hover:text-blue-800 flex items-center space-x-1" title="Edit">
                                <i class="fas fa-pencil-alt"></i>
                                <span>Edit</span>
                            </a>
                            <!-- Delete Button -->
                            <a href="{{ url_for('delete_category', category_id=category._id) }}" class="text-red-600 hover:text-red-800 flex items-center space-x-1 ml-2" title="Delete">
                                <i class="fas fa-trash-alt"></i>
                                <span>Delete</span>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
