<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
      
        <!-- Title -->
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Admin Login</h2>

        <!-- Flash Message -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="mb-4 p-4 rounded-lg 
                    {% if category == 'error' %}bg-red-500 text-white{% else %}bg-green-500 text-white{% endif %} flex justify-between items-center">
                    <span>{{ message }}</span>
                    <button class="ml-2 font-bold cursor-pointer" onclick="this.parentElement.style.display='none';">&times;</button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('admin_login') }}">
            <!-- Email Field -->
            <div class="mb-4">
                <label for="email" class="block text-gray-700 mb-2">Email:</label>
                <input type="email" id="email" name="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Password Field -->
            <div class="mb-6">
                <label for="password" class="block text-gray-700 mb-2">Password:</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Login
            </button>
        </form>

        <!-- Back to Home Link -->
        <div class="mt-4 text-center">
            <a href="{{ url_for('index') }}" class="text-gray-600 hover:underline">Back to Home</a>
        </div>
    </div>
</body>
</html>
