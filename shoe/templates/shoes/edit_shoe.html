<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shoe</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/kTc+9FfCLhVJj6MY26YJl5M1t4GnL7yoj7RC1Q5uPqkuFV69Wr8ldQcSRdgo8cM/Mh58HW8Yc3nbA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-blue-50 flex">
    <!-- Sidebar -->
    <aside class="bg-blue-700 text-white w-64 min-h-screen p-4">
    
        <nav>
            <ul class="space-y-4">
                <li>
                    <a href="{{ url_for('view_shoes') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-800 {{ 'bg-blue-800' if request.endpoint == 'view_shoes' else '' }}">
                        <i class="fas fa-shoe-prints mr-2"></i>Shoes
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('view_categories') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-800 {{ 'bg-blue-800' if request.endpoint == 'view_categories' else '' }}">
                        <i class="fas fa-tags mr-2"></i>Categories
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('admin_view_orders') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-800 {{ 'bg-blue-800' if request.endpoint == 'admin_view_orders' else '' }}">
                        <i class="fas fa-shopping-cart mr-2"></i>View Orders
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('logout') }}" class="flex items-center px-4 py-2 rounded hover:bg-blue-800">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 bg-blue-50">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-700">Edit Shoe</h1>
        </div>
        
        <form action="{{ url_for('edit_shoe', shoe_id=shoe._id) }}" method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded-lg shadow-md">
            <!-- Shoe Fields -->
            <div class="mb-4">
                <label for="shoe_name" class="block text-blue-700 font-semibold">Shoe Name</label>
                <input type="text" id="shoe_name" name="shoe_name" value="{{ shoe.shoe_name }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
            </div>

            <div class="mb-4">
                <label for="brand" class="block text-blue-700 font-semibold">Brand</label>
                <input type="text" id="brand" name="brand" value="{{ shoe.brand }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
            </div>

            <div class="mb-4">
                <label for="description" class="block text-blue-700 font-semibold">Description</label>
                <textarea id="description" name="description" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" rows="4" required>{{ shoe.description }}</textarea>
            </div>

            <div class="mb-4">
                <label for="status" class="block text-blue-700 font-semibold">Status</label>
                <select id="status" name="status" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                    <option value="available" {{ 'selected' if shoe.status == 'available' else '' }}>Available</option>
                    <option value="unavailable" {{ 'selected' if shoe.status == 'unavailable' else '' }}>Unavailable</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="category" class="block text-blue-700 font-semibold">Category</label>
                <select id="category" name="category" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                    {% for category in categories %}
                    <option value="{{ category._id }}" {{ 'selected' if shoe.category_id == category._id else '' }}>{{ category.category_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="image_url" class="block text-blue-700 font-semibold">Image URL</label>
                <input type="url" id="image_url" name="image_url" value="{{ shoe.image }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-blue-700 font-semibold">Shipping Methods</label>
                <div class="flex items-center mb-2">
                    <input type="checkbox" id="pickup" name="shipping_method" value="pickup" class="mr-2 focus:ring focus:ring-blue-500" {{ 'checked' if 'pickup' in shoe.shipping_methods else '' }}>
                    <label for="pickup" class="text-gray-700">Pickup</label>
                </div>
                <div class="flex items-center mb-2">
                    <input type="checkbox" id="online" name="shipping_method" value="online" class="mr-2 focus:ring focus:ring-blue-500" {{ 'checked' if 'online' in shoe.shipping_methods else '' }}>
                    <label for="online" class="text-gray-700">Online</label>
                </div>
            </div>

            <div class="mb-4">
                <label for="cost" class="block text-blue-700 font-semibold">Cost</label>
                <input type="number" id="cost" name="cost" value="{{ shoe.cost }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
            </div>

            <!-- Variants Section -->
            <div id="variants" class="mb-6">
                <h2 class="text-xl font-bold text-blue-700 mb-4">Shoe Variants</h2>
                {% for variant in shoe.variants %}
                <div class="variant mb-4 p-4 border border-blue-200 rounded-lg bg-blue-50">
                    <div class="mb-2">
                        <label for="size" class="block text-blue-700 font-semibold">Size</label>
                        <input type="text" name="size[]" value="{{ variant.size }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                    </div>
                    <div class="mb-2">
                        <label for="gender" class="block text-blue-700 font-semibold">Gender</label>
                        <input type="text" name="gender[]" value="{{ variant.gender }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                    </div>
                    <div class="mb-2">
                        <label for="stock" class="block text-blue-700 font-semibold">Stock</label>
                        <input type="number" name="stock[]" value="{{ variant.stock }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                    </div>
                    <div class="mb-2">
                        <label for="color" class="block text-blue-700 font-semibold">Color</label>
                        <input type="text" name="color[]" value="{{ variant.color }}" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                    </div>
                    <div class="mb-2">
                        <label for="variant_status" class="block text-blue-700 font-semibold">Status</label>
                        <select name="variant_status[]" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500" required>
                            <option value="available" {{ 'selected' if variant.status == 'available' else '' }}>Available</option>
                            <option value="unavailable" {{ 'selected' if variant.status == 'unavailable' else '' }}>Unavailable</option>
                        </select>
                    </div>
                    <button type="button" class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 mt-2 remove-variant">Remove Variant</button>
                </div>
                {% endfor %}
            </div>

            <!-- Hidden Template for New Variants -->
            <div class="variant mb-4 p-4 border border-blue-200 rounded-lg bg-blue-50 hidden" id="variant-template">
                <div class="mb-2">
                    <label for="size" class="block text-blue-700 font-semibold">Size</label>
                    <input type="text" name="size[]" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500">
                </div>
                <div class="mb-2">
                    <label for="gender" class="block text-blue-700 font-semibold">Gender</label>
                    <input type="text" name="gender[]" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500">
                </div>
                <div class="mb-2">
                    <label for="stock" class="block text-blue-700 font-semibold">Stock</label>
                    <input type="number" name="stock[]" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500">
                </div>
                <div class="mb-2">
                    <label for="color" class="block text-blue-700 font-semibold">Color</label>
                    <input type="text" name="color[]" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500">
                </div>
                <div class="mb-2">
                    <label for="variant_status" class="block text-blue-700 font-semibold">Status</label>
                    <select name="variant_status[]" class="w-full px-3 py-2 border border-blue-300 rounded-lg focus:ring focus:ring-blue-500">
                        <option value="available">Available</option>
                        <option value="unavailable">Unavailable</option>
                    </select>
                </div>
                <button type="button" class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 mt-2 remove-variant">Remove Variant</button>
            </div>

            <!-- Add Variant Button -->
            <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 mb-6" id="add-variant">Add Variant</button>

            <!-- Action Buttons -->
            <div class="flex justify-between mt-6">
                <a href="{{ url_for('view_shoes') }}" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">Go Back</a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Update Shoe</button>
            </div>
        </form>
    </main>

    <!-- Script for Adding/Removing Variants -->
    <script>
        document.getElementById('add-variant').addEventListener('click', function () {
            let variantTemplate = document.getElementById('variant-template').cloneNode(true);
            variantTemplate.classList.remove('hidden');
            variantTemplate.removeAttribute('id');  // Remove ID to prevent duplication
            document.getElementById('variants').appendChild(variantTemplate);
        });

        document.getElementById('variants').addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-variant')) {
                e.target.closest('.variant').remove();
            }
        });
    </script>
</body>
</html>
